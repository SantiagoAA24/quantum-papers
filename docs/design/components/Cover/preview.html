<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; }
.cover { position: relative; width: 960px; height: 288px; background: var(--bg-base); overflow: hidden; }
.cover svg { display: block; }
.k-accent { fill: var(--accent); }
.k-text { fill: var(--text); }
.k-border { fill: var(--border); }
.k-muted { fill: var(--text-muted); }
.blk { rx: var(--radius-md); }
.name { position: absolute; left: 32px; top: 132px; margin: 0; font: 700 64px/0.95 var(--font-sans); letter-spacing: -0.02em; color: var(--text); white-space: nowrap; }
.tagline { position: absolute; left: 32px; top: 214px; margin: 0; font: 400 13px/1.4 var(--font-mono); color: var(--text-muted); }
</style>
</head><body>
<div class="cover">
<!--
derivation
blocks: accent 280×96, text 96×96, border 184×96, text-muted 48×96; gap space-2 (8px); corners radius-md.
arrangement: a strip of unequal bands running along the top edge, then a dot field to the right edge.
pattern: dot grid at space-6 (24px) pitch, the README's "technical, mono, one ink on a 48px grid" system, not a decorative motif.
steps: space-2, space-6, radius-md; name in display (Space Grotesk 700) beneath the band: the 13-letter name is wider than 440px at 64px.
-->
<svg width="960" height="96" viewBox="0 0 960 96" aria-hidden="true">
<defs>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="2.5" class="k-muted"/></pattern>
</defs>
<rect class="blk k-accent" x="0" y="0" width="280" height="96"/>
<rect class="blk k-text" x="288" y="0" width="96" height="96"/>
<rect class="blk k-border" x="392" y="0" width="184" height="96"/>
<rect class="blk k-muted" x="584" y="0" width="48" height="96"/>
<rect x="656" y="0" width="304" height="96" fill="url(#dots)"/>
</svg>
<h1 class="name">QuantumPapers</h1>
<p class="tagline">Búsqueda semántica sobre papers de ML cuántico</p>
</div>
</body></html>
