<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>QuantumPapers móvil: resultados</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/quantumpapers/tokens.css">
<link rel="stylesheet" href="ds/quantumpapers/components/bundle.css">
<script src="ds/quantumpapers/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--text);outline-offset:2px}
</style>
</helmet>
<div style="background-color:var(--bg-base);background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:48px 48px;color:var(--text);font-family:var(--font-sans);min-height:2500px;">
<div style="max-width:var(--container-max);margin:0 auto;padding:0 20px;">

<x-import component-from-global-scope="QuantumPapers.SiteHeader"></x-import>

<header style="padding:32px 0 var(--space-6);">
<x-import component-from-global-scope="QuantumPapers.Kicker" style="display:block;margin-bottom:16px;">búsqueda semántica</x-import>
<x-import component-from-global-scope="QuantumPapers.SearchPanel" default-value="circuitos variacionales para clasificación"></x-import>
<p style="margin:16px 0 0;font-family:var(--font-mono);font-size:13px;line-height:1.4;color:var(--text-muted);">[N] resultados · ordenados por similitud</p>
</header>

<details open style="margin-bottom:var(--space-6);">
<summary style="display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;box-sizing:border-box;padding:0 16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-panel);font-family:var(--font-mono);font-size:15px;line-height:1;color:var(--text);cursor:pointer;list-style:none;"><span>filtros</span><span style="font-size:13px;color:var(--accent);">1 activo −</span></summary>
<div style="display:flex;flex-direction:column;gap:24px;padding:16px 0 8px;">
<x-import component-from-global-scope="QuantumPapers.FilterGroup" legend="tema">
<x-import component-from-global-scope="QuantumPapers.Checkbox" name="tema" value="vqc" default-checked="{{yes}}">#vqc</x-import>
<x-import component-from-global-scope="QuantumPapers.Checkbox" name="tema" value="qsvm">#qsvm</x-import>
<x-import component-from-global-scope="QuantumPapers.Checkbox" name="tema" value="qnn">#qnn</x-import>
<x-import component-from-global-scope="QuantumPapers.Checkbox" name="tema" value="barren-plateaus">#barren-plateaus</x-import>
<x-import component-from-global-scope="QuantumPapers.Checkbox" name="tema" value="qaoa">#qaoa</x-import>
</x-import>
<x-import component-from-global-scope="QuantumPapers.FilterGroup" legend="año">
<div class="qp-filter__row">
<div style="flex:1 1 0;min-width:0;"><x-import component-from-global-scope="QuantumPapers.TextField" label="desde" name="desde" placeholder="[año]"></x-import></div>
<div style="flex:1 1 0;min-width:0;"><x-import component-from-global-scope="QuantumPapers.TextField" label="hasta" name="hasta" placeholder="[año]"></x-import></div>
</div>
</x-import>
<x-import component-from-global-scope="QuantumPapers.FilterGroup" legend="ordenar por">
<x-import component-from-global-scope="QuantumPapers.Radio" name="orden" value="similitud" default-checked="{{yes}}">similitud</x-import>
<x-import component-from-global-scope="QuantumPapers.Radio" name="orden" value="año">año</x-import>
</x-import>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;">
<x-import component-from-global-scope="QuantumPapers.Button">aplicar</x-import>
<x-import component-from-global-scope="QuantumPapers.TextLink">limpiar_filtros →</x-import>
</div>
</div>

</details>

<x-import component-from-global-scope="QuantumPapers.Panel" label="resultados de ejemplo · página 1 de [N]">
<ol class="qp-results">
<x-import component-from-global-scope="QuantumPapers.ResultRow" rank="01" title="Variational quantum circuits for image classification" topic="vqc" similarity="0.92"></x-import>
<x-import component-from-global-scope="QuantumPapers.ResultRow" rank="02" title="Hybrid quantum-classical neural networks for small datasets" topic="qnn" similarity="0.81"></x-import>
<x-import component-from-global-scope="QuantumPapers.ResultRow" rank="03" title="Quantum kernel methods under limited training data" topic="qsvm" similarity="0.74"></x-import>
<x-import component-from-global-scope="QuantumPapers.ResultRow" rank="04" title="Trainability and barren plateaus in parameterized circuits" topic="barren-plateaus" similarity="0.69"></x-import>
</ol>
</x-import>

<div style="margin-top:var(--space-6);"><x-import component-from-global-scope="QuantumPapers.Pagination" pages="{{paginas}}" prev-href="#" next-href="#"></x-import></div>

<div style="margin-top:64px;"><x-import component-from-global-scope="QuantumPapers.SiteFooter" left="datos: arXiv" right="portafolio"></x-import></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2500}}'>
class Component extends DCLogic {
renderVals() {
return {
  yes: true,
  paginas: [
    { label: "1", href: "#", current: true },
    { label: "2", href: "#" },
    { label: "3", href: "#" },
    { gap: true },
    { label: "[N]", href: "#" }
  ]
};
}
}
</script>
</body>
</html>
