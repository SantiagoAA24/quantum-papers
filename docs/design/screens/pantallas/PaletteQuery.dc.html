<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>QuantumPapers: paleta ⌘K con consulta</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/quantumpapers/tokens.css">
<link rel="stylesheet" href="ds/quantumpapers/components/bundle.css">
<script src="ds/quantumpapers/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
</style>
</helmet>
<div style="position:relative;background-color:var(--bg-base);background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:48px 48px;color:var(--text);font-family:var(--font-sans);min-height:900px;">
<div style="max-width:var(--container-max);margin:0 auto;padding:0 clamp(20px,4vw,40px);">

<x-import component-from-global-scope="QuantumPapers.SiteHeader"></x-import>

<section style="padding:clamp(56px,8vw,96px) 0 56px;">
<x-import component-from-global-scope="QuantumPapers.Kicker" style="display:block;margin-bottom:20px;">búsqueda semántica sobre papers de arXiv</x-import>
<h1 style="margin:0;max-width:1000px;font-family:var(--font-sans);font-weight:700;font-size:clamp(36px,5.6vw,72px);line-height:1.05;letter-spacing:-0.02em;text-wrap:balance;">Pregunta con tus palabras. <span style="color:var(--accent);">Obtén los papers más cercanos.</span></h1>
<div style="margin-top:48px;"><x-import component-from-global-scope="QuantumPapers.SearchPanel" default-value="circuitos variacionales para clasificación"></x-import></div>
</section>

</div>

<div style="position:absolute;top:0;right:0;bottom:0;left:0;background:rgba(11,15,20,0.82);display:flex;justify-content:center;align-items:flex-start;padding:120px 20px 0;">
<x-import component-from-global-scope="QuantumPapers.CommandPalette" default-value="barren" groups="{{grupos}}"></x-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
return {
  grupos: [
    { label: "papers", items: [
      { label: "Trainability and barren plateaus in parameterized circuits", hint: "#barren-plateaus", active: true },
      { label: "Mitigating barren plateaus with layerwise training", hint: "#vqc" },
      { label: "Barren plateaus in quantum kernel methods", hint: "#qsvm" }
    ] },
    { label: "temas", items: [
      { label: "#barren-plateaus", hint: "tema" }
    ] },
    { label: "acciones", items: [
      { label: "buscar «barren» en todo el índice", hint: "↵" }
    ] }
  ]
};
}
}
</script>
</body>
</html>
