[project]
name = "ingest"
version = "0.1.0"
description = "arXiv ingestion pipeline for QuantumPapers"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "openai>=3.50.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "tenacity>=9.2.1",
    "typer>=0.29.1",
]

[project.scripts]
ingest = "ingest.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
]
